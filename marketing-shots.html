<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大蓝海 · App Store 截图 (iPhone 6.5")</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04101F;display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.s{width:414px;height:896px;overflow:hidden;position:relative;background:#04101F;border-radius:0}
.s iframe{width:414px;height:896px;border:none;display:block}
</style>
</head>
<body>

<div class="s" id="s1"><iframe src="index.html"></iframe></div>
<div class="s" id="s2"><iframe src="index.html"></iframe></div>
<div class="s" id="s3"><iframe src="index.html"></iframe></div>
<div class="s" id="s4"><iframe src="index.html"></iframe></div>
<div class="s" id="s5"><iframe src="index.html"></iframe></div>

<script>
// 生成最近 n 天的日期字符串数组
function genDates(n){
  const a=[];
  for(let i=0;i<n;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    a.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return a;
}
// 预设数据: 清心岛连续21天(已征服), 戒烟14天, 健身7天, 早睡3天
function buildData(seedPosts){
  return {
    checkins:{
      qingxin:genDates(21),
      jieyan:genDates(14),
      jianshen:genDates(7),
      zaoshui:genDates(3)
    },
    certificates:[{island:'qingxin',date:genDates(1)[0]}],
    posts: seedPosts ? seedPosts.slice() : [],
    msgs: [],
    captain:null
  };
}
const done={};
function setup(id, action){
  const f=document.querySelector('#'+id+' iframe');
  f.addEventListener('load',()=>{
    if(done[id])return; done[id]=true;
    const w=f.contentWindow;
    try{
      const data=buildData(w.SEED_POSTS);
      w.localStorage.setItem('dalanhai_v2', JSON.stringify(data));
      action(w);
      w.render();
    }catch(e){ console.error(id, e); }
  });
}
// 5 个画面
setup('s1', w=>{ w.currentView={tab:'islands',island:null,postId:null,groupId:null}; });
setup('s2', w=>{ w.currentView={tab:'islands',island:'qingxin',postId:null,groupId:null}; });
setup('s3', w=>{ w.currentView={tab:'port',island:null,postId:null,groupId:null}; });
setup('s4', w=>{ w.currentView={tab:'msg',island:null,postId:null,groupId:null}; });
setup('s5', w=>{ w.currentView={tab:'islands',island:null,postId:null,groupId:null}; setTimeout(()=>{try{w.openMask('maskCert');}catch(e){}},400); });
</script>
</body>
</html>
