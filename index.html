<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061224">
<title>大蓝海 · GRAND BLUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --abyss:#04101F;         /* 深海 */
    --deep:#0A1F3D;          /* 深蓝 */
    --ocean:#123A6B;         /* 主蓝 */
    --wave:#1E5C99;          /* 浪 */
    --foam:#BFE3FF;          /* 浪花 */
    --sky:#7DC4FF;           /* 天空 */
    --gold:#E8B84A;          /* 帝国金 */
    --gold-2:#F7D77A;
    --copper:#B7702B;        /* 铜 */
    --coral:#E45B3A;         /* 旗帜红 */
    --parchment:#F1E4C6;     /* 羊皮纸 */
    --parchment-2:#E4CFA0;
    --ink:#1B1408;
    --sub:#8FA6C4;
    --line:rgba(255,255,255,.09);
    --card:rgba(255,255,255,.05);
    --card-solid:#0E2547;
    --glass:rgba(10,31,61,.55);
  }
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:#EAF2FF;font-size:15px;line-height:1.55;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a4c86 0%, transparent 60%),
      radial-gradient(800px 500px at 90% 110%, #0b2a52 0%, transparent 65%),
      linear-gradient(180deg,#04101F 0%,#061a34 45%,#04101F 100%);
  }
  /* 水波纹背景层 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(125,196,255,.12) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, rgba(232,184,74,.10) 0 1.5px, transparent 3px),
      radial-gradient(circle at 40% 80%, rgba(125,196,255,.10) 0 2px, transparent 3px);
    background-size:220px 220px, 300px 300px, 260px 260px;
  }
  #app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;
       box-shadow:0 0 60px rgba(0,0,0,.6);}
  .statusbar{height:env(safe-area-inset-top,20px)}

  /* ============ 顶栏 ============ */
  .topbar{
    position:relative;padding:10px 16px 14px;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,rgba(4,16,31,.9),rgba(4,16,31,0));
    z-index:5;
  }
  .topbar h1{font-family:"Cinzel","Noto Serif SC",serif;font-size:22px;font-weight:800;letter-spacing:1.5px;
             background:linear-gradient(180deg,#FFF3C4 0%,#E8B84A 55%,#8A5B14 100%);
             -webkit-background-clip:text;background-clip:text;color:transparent;
             text-shadow:0 1px 0 rgba(0,0,0,.4)}
  .topbar .sub{font-size:11px;color:var(--sub);letter-spacing:1px;margin-top:2px}
  .topbar .back{font-size:26px;color:var(--gold);cursor:pointer;width:34px;line-height:1;
                text-shadow:0 0 8px rgba(232,184,74,.5)}
  .topbar .right{width:34px;text-align:right;color:var(--gold);font-size:20px;cursor:pointer}
  .hidden{display:none!important}

  /* 顶栏装饰罗盘 */
  .compass-mark{
    position:absolute;right:-30px;top:-10px;width:110px;height:110px;opacity:.10;pointer-events:none;
  }

  /* ============ 内容 ============ */
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 100px;position:relative;z-index:2}
  .content::-webkit-scrollbar{display:none}

  /* ============ Hero 航海图 ============ */
  .voyage-hero{
    position:relative;border-radius:22px;overflow:hidden;margin:4px 0 14px;
    background:
      radial-gradient(120% 90% at 50% 10%, rgba(232,184,74,.18) 0%, transparent 55%),
      linear-gradient(160deg,#0B2A55 0%,#0A1F3D 60%,#04101F 100%);
    border:1px solid rgba(232,184,74,.25);
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 40px rgba(125,196,255,.08);
    padding:18px 18px 16px;
  }
  .voyage-hero .eyebrow{font-family:"Cinzel",serif;font-size:11px;letter-spacing:3px;color:var(--gold);opacity:.85}
  .voyage-hero .title{font-family:"Noto Serif SC",serif;font-weight:800;font-size:22px;margin:6px 0 4px;
                      background:linear-gradient(180deg,#fff,#BFE3FF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .voyage-hero .desc{font-size:12px;color:var(--sub)}
  .voyage-hero .waves{position:absolute;left:0;right:0;bottom:-2px;height:44px;opacity:.55}
  .voyage-hero .ship{position:absolute;right:14px;top:14px;font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}

  /* ============ 岛屿卡片 ============ */
  .section-title{
    display:flex;align-items:center;gap:10px;margin:20px 4px 10px;
    font-family:"Cinzel","Noto Serif SC",serif;font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;
  }
  .section-title::before,.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.5),transparent)}

  .island-card{
    position:relative;background:linear-gradient(160deg,rgba(18,58,107,.75),rgba(10,31,61,.85));
    border:1px solid rgba(125,196,255,.14);
    border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;
    transition:transform .12s ease, box-shadow .2s;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .island-card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0%, rgba(232,184,74,.10), transparent 55%);
  }
  .island-card:active{transform:scale(.98)}
  .island-icon{
    width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:28px;flex-shrink:0;position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15), 0 4px 14px rgba(0,0,0,.35);
  }
  .island-icon::after{
    content:"";position:absolute;inset:-2px;border-radius:18px;
    background:linear-gradient(135deg,rgba(232,184,74,.5),transparent 60%);
    z-index:-1;filter:blur(6px);opacity:.7;
  }
  .island-info{flex:1;min-width:0}
  .island-name{font-size:16px;font-weight:700;letter-spacing:.5px;color:#F4FAFF}
  .island-slogan{font-size:12px;color:var(--foam);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .island-meta{font-size:11px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .dot.off{background:#3d5375;box-shadow:none}
  .island-streak{
    font-family:"Cinzel",serif;font-size:14px;font-weight:800;
    padding:6px 12px;border-radius:999px;flex-shrink:0;
    background:linear-gradient(180deg,#F7D77A,#B7702B);
    color:#2A1A05;box-shadow:0 4px 10px rgba(183,112,43,.4), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .island-streak small{font-size:10px;font-weight:600;margin-left:2px}

  .create-card{
    background:transparent;border:1.5px dashed rgba(232,184,74,.35);border-radius:18px;padding:16px;
    text-align:center;color:var(--gold);font-size:13px;letter-spacing:1px;margin-bottom:12px;cursor:pointer;
    font-family:"Cinzel","Noto Serif SC",serif;
  }
  .create-card:active{background:rgba(232,184,74,.06)}

  /* ============ 岛屿详情 Hero ============ */
  .detail-hero{
    position:relative;border-radius:20px;padding:26px 20px 22px;text-align:center;margin-bottom:14px;overflow:hidden;
    border:1px solid rgba(232,184,74,.3);
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(232,184,74,.2), transparent 55%),
      linear-gradient(180deg,#0d3163,#04101F);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 40px rgba(125,196,255,.1);
  }
  .detail-hero .ic{font-size:52px;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .detail-hero h2{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:800;letter-spacing:2px;
                  background:linear-gradient(180deg,#FFF3C4,#E8B84A);-webkit-background-clip:text;background-clip:text;color:transparent}
  .detail-hero .slogan{font-size:12px;color:var(--foam);opacity:.85;margin-top:4px;letter-spacing:.5px}
  .streak-big{font-family:"Cinzel",serif;font-size:60px;font-weight:800;line-height:1;margin:16px 0 4px;
              background:linear-gradient(180deg,#FFF3C4,#E8B84A 60%,#B7702B);-webkit-background-clip:text;background-clip:text;color:transparent;
              text-shadow:0 4px 10px rgba(0,0,0,.4)}
  .streak-label{font-size:12px;color:var(--sub);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase}

  /* 21 天格子 */
  .progress-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
  .grid-cell{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);
             display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
  .grid-cell.done{color:#2A1A05;font-weight:700;background:linear-gradient(180deg,#F7D77A,#E8B84A);
                  border-color:rgba(232,184,74,.6);box-shadow:0 2px 8px rgba(232,184,74,.35), inset 0 1px 0 rgba(255,255,255,.4)}
  .grid-cell.today{outline:2px solid var(--foam);outline-offset:2px}

  /* 按钮 */
  .btn-primary{
    width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;
    background:linear-gradient(180deg,#F7D77A,#B7702B);color:#2A1A05;
    box-shadow:0 8px 20px rgba(183,112,43,.4), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .1s, opacity .1s;
  }
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:disabled{opacity:.5;background:linear-gradient(180deg,#5a6f8c,#2d3d55);color:#c8d5e6;
                        box-shadow:none;cursor:not-allowed}
  .btn-ghost-gold{
    width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:600;
    background:transparent;border:1.5px solid rgba(232,184,74,.5);color:var(--gold);cursor:pointer;margin-top:10px;
  }
  .btn-ocean{background:linear-gradient(180deg,#2c74c2,#123A6B);color:#fff;
             box-shadow:0 8px 20px rgba(18,58,107,.5), inset 0 1px 0 rgba(255,255,255,.2)}

  /* 列表 */
  .list-item{
    background:linear-gradient(180deg,rgba(18,58,107,.6),rgba(10,31,61,.7));
    border:1px solid rgba(125,196,255,.1);
    border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;
  }
  .list-item:active{background:rgba(30,92,153,.6)}
  .list-item .li-ic{font-size:20px;width:28px;text-align:center;color:var(--gold)}
  .list-item .li-text{flex:1;font-size:14px;color:#E5EFFA}
  .list-item .li-arrow{color:var(--sub);font-size:18px}

  /* 证书 */
  .cert-card{
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,240,180,.6), transparent 60%),
      linear-gradient(160deg,#F1E4C6,#D9BE85);
    color:#3B2708;border:1px solid #B08640;
    border-radius:14px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .cert-card::before{
    content:"";position:absolute;inset:6px;border:1px dashed rgba(59,39,8,.4);border-radius:10px;pointer-events:none
  }
  .cert-card .ct{font-family:"Cinzel","Noto Serif SC",serif;font-size:15px;font-weight:800;letter-spacing:1px}
  .cert-card .cd{font-size:12px;margin-top:4px;opacity:.8}

  /* ============ 港口 · 瀑布流 ============ */
  .port-tags{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px}
  .port-tags::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:12px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--foam);cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:linear-gradient(180deg,#F7D77A,#B7702B);color:#2A1A05;border-color:transparent;font-weight:700}

  .masonry{column-count:2;column-gap:10px}
  .post{
    break-inside:avoid;-webkit-column-break-inside:avoid;
    background:linear-gradient(180deg,rgba(18,58,107,.55),rgba(10,31,61,.75));
    border:1px solid rgba(125,196,255,.12);
    border-radius:14px;overflow:hidden;margin-bottom:10px;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .post .cover{width:100%;display:block;aspect-ratio:var(--ar,3/4);object-fit:cover;background:#0a1f3d}
  .post .cover.gradient{background-size:cover;background-position:center;position:relative}
  .post .cover.gradient .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .post .body{padding:10px 12px 12px}
  .post .title{font-size:13px;font-weight:600;color:#EAF2FF;line-height:1.4}
  .post .meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--sub)}
  .post .author{display:flex;align-items:center;gap:6px}
  .post .avatar{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#F7D77A,#B7702B);
                display:flex;align-items:center;justify-content:center;font-size:11px;color:#2A1A05;font-weight:700}
  .post .likes{color:var(--gold)}
  .post-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(232,184,74,.15);color:var(--gold);margin-right:4px;margin-top:6px}

  /* 底栏居中发布按钮 */
  .tab-pub{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;cursor:pointer}
  .pub-btn{
    width:54px;height:54px;border-radius:50%;
    background:linear-gradient(180deg,#F7D77A,#B7702B);color:#2A1A05;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(183,112,43,.55), inset 0 2px 0 rgba(255,255,255,.5);
    border:2px solid rgba(255,255,255,.25);
    margin-top:-26px;position:relative;
  }
  .pub-btn::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(232,184,74,.45)}
  .pub-btn:active{transform:translateY(2px)}
  .tab-pub .pl{font-size:10px;color:var(--gold);letter-spacing:2px;margin-top:5px}

  /* ============ 消息 ============ */
  .msg-item{
    display:flex;gap:12px;padding:14px 12px;border-radius:14px;
    background:linear-gradient(180deg,rgba(18,58,107,.55),rgba(10,31,61,.7));
    border:1px solid rgba(125,196,255,.1);margin-bottom:8px;align-items:center;cursor:pointer;
  }
  .msg-avatar{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;
              background:linear-gradient(135deg,#123A6B,#0A1F3D);border:1px solid rgba(232,184,74,.4);color:var(--gold)}
  .msg-body{flex:1;min-width:0}
  .msg-head{display:flex;justify-content:space-between;align-items:baseline}
  .msg-name{font-size:14px;font-weight:600;color:#EAF2FF}
  .msg-time{font-size:11px;color:var(--sub)}
  .msg-last{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg-badge{background:var(--coral);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:8px}

  /* ============ 船长 ============ */
  .captain-hero{
    position:relative;border-radius:20px;padding:22px 18px;overflow:hidden;margin-bottom:14px;
    background:
      radial-gradient(100% 80% at 50% 0%, rgba(232,184,74,.2), transparent 55%),
      linear-gradient(160deg,#0d3163,#04101F);
    border:1px solid rgba(232,184,74,.3);
  }
  .captain-row{display:flex;align-items:center;gap:14px}
  .captain-avatar{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,#F7D77A,#B7702B);color:#2A1A05;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.4);
    border:2px solid rgba(232,184,74,.6);flex-shrink:0;
  }
  .captain-name{font-family:"Noto Serif SC",serif;font-size:19px;font-weight:800;color:#F4FAFF;letter-spacing:1px}
  .captain-rank{font-family:"Cinzel",serif;font-size:11px;color:var(--gold);letter-spacing:2px;margin-top:2px}
  .captain-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .cstat{text-align:center;padding:10px 4px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
  .cstat .n{font-family:"Cinzel",serif;font-size:22px;font-weight:800;color:var(--gold)}
  .cstat .l{font-size:11px;color:var(--sub);margin-top:2px;letter-spacing:1px}

  /* 登录卡 */
  .auth-tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
  .auth-tab{flex:1;padding:9px 4px;text-align:center;font-size:12px;color:var(--sub);border-radius:9px;cursor:pointer;letter-spacing:.5px}
  .auth-tab.active{background:linear-gradient(180deg,#F7D77A,#B7702B);color:#2A1A05;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

  .field{margin-bottom:10px;position:relative}
  .field label{display:block;font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:6px;font-family:"Cinzel",serif;text-transform:uppercase}
  .input{
    width:100%;padding:13px 14px;border-radius:12px;font-size:14px;color:#fff;
    background:rgba(0,0,0,.35);border:1px solid rgba(125,196,255,.2);outline:none;
    transition:border-color .15s, box-shadow .15s;
    font-family:inherit;
  }
  .input:focus{border-color:rgba(232,184,74,.7);box-shadow:0 0 0 3px rgba(232,184,74,.15)}
  .input::placeholder{color:#5a7099}
  .row-code{display:flex;gap:8px}
  .row-code .input{flex:1}
  .btn-code{
    flex-shrink:0;padding:0 14px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:1px;
    background:rgba(232,184,74,.15);border:1px solid rgba(232,184,74,.5);color:var(--gold);cursor:pointer;
    min-width:98px;
  }
  .btn-code:disabled{opacity:.5;cursor:not-allowed}
  .auth-tip{font-size:11px;color:var(--sub);text-align:center;margin-top:12px}
  .auth-tip a{color:var(--gold);text-decoration:none}

  /* ============ Tabbar ============ */
  .tabbar{
    position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
    height:calc(72px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(4,16,31,.7),rgba(4,16,31,.95));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(232,184,74,.2);
    display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
       color:var(--sub);cursor:pointer;font-size:10px;letter-spacing:2px;position:relative}
  .tab .ti{font-size:22px;line-height:1;filter:grayscale(.4);opacity:.75;transition:all .15s}
  .tab.active{color:var(--gold)}
  .tab.active .ti{filter:none;opacity:1;transform:translateY(-1px);text-shadow:0 0 12px rgba(232,184,74,.6)}
  .tab.active::before{
    content:"";position:absolute;top:6px;width:24px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  /* ============ 弹窗 ============ */
  .mask{position:fixed;inset:0;background:rgba(4,10,20,.75);backdrop-filter:blur(4px);display:none;
        align-items:center;justify-content:center;z-index:100;padding:24px}
  .mask.show{display:flex}
  .modal{
    background:linear-gradient(180deg,#0e2547,#04101F);
    border:1px solid rgba(232,184,74,.35);
    border-radius:20px;padding:24px 22px;max-width:360px;width:100%;text-align:center;

const SEED_MSGS=[
  {id:'m1',type:'sys',name:'船务长',avatar:'⚓',last:'欢迎登船！先去岛屿完成首次打卡吧',time:'现在',badge:1},
  {id:'m2',type:'crew',name:'健身岛 · 铁血船队',avatar:'💪',last:'磐石：今天谁陪我练背？',time:'2 分钟前',badge:3},
  {id:'m3',type:'crew',name:'戒烟岛 · 无烟港',avatar:'🚭',last:'南十字获得【坚持14天】徽章',time:'34 分钟前',badge:0},
  {id:'m4',type:'sys',name:'系统 · 航海日报',avatar:'📜',last:'昨日全站共完成 12,847 次打卡',time:'今天 08:00',badge:0},
  {id:'m5',type:'crew',name:'清心岛 · 静水深流',avatar:'🧘',last:'铁锚：分享一段冥想音频',time:'昨天',badge:0},
  {id:'m6',type:'sys',name:'官方公告',avatar:'📣',last:'V1.2 港口瀑布流已上线，来发第一贴',time:'昨天',badge:0},
];

/* ============ 存储 ============ */
function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem('dalanhai_v2')||'null');
    if(d) return d;
  }catch(e){}
  return {checkins:{},certificates:[],posts:SEED_POSTS.slice(),msgs:SEED_MSGS.slice(),captain:null};
}
function saveData(d){localStorage.setItem('dalanhai_v2',JSON.stringify(d));}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getCheckins(id){return loadData().checkins[id]||[];}
function isCheckedToday(id){return getCheckins(id).includes(todayStr());}
function streak(id){
  const set=new Set(getCheckins(id));if(!set.size)return 0;
  let count=0,d=new Date();
  if(!set.has(dateStr(d)))return 0;
  while(set.has(dateStr(d))){count++;d.setDate(d.getDate()-1);}
  return count;
}
function totalDays(id){return getCheckins(id).length}
function doCheckin(id){
  const d=loadData(),t=todayStr();
  if(!d.checkins[id])d.checkins[id]=[];
  if(d.checkins[id].includes(t))return false;
  d.checkins[id].push(t);saveData(d);
  if(streak(id)>=TARGET && !d.certificates.some(c=>c.island===id)){
    d.certificates.push({island:id,date:t});saveData(d);return 'cert';
  }
  return true;
}

/* ============ 渲染入口 ============ */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===currentView.tab));
  const c=document.getElementById('content');
  const back=document.getElementById('backBtn');
  const topRight=document.getElementById('topRight');
  topRight.innerHTML='';

  if(currentView.island){
    back.classList.remove('hidden');
    document.getElementById('topTitle').textContent=getIsland(currentView.island).name;
    document.getElementById('topSub').textContent='ON VOYAGE · '+streak(currentView.island)+' DAYS';
    c.innerHTML=renderIsland(currentView.island);
    return;
  }
  back.classList.add('hidden');
  if(currentView.tab==='islands'){
    document.getElementById('topTitle').textContent='大蓝海';
    document.getElementById('topSub').textContent='GRAND · BLUE · VOYAGE';
    c.innerHTML=renderIslands();
  }else if(currentView.tab==='port'){
    document.getElementById('topTitle').textContent='港口';
    document.getElementById('topSub').textContent='HARBOR · 与同海域的船员交换故事';
    c.innerHTML=renderPort();
  }else if(currentView.tab==='msg'){
    document.getElementById('topTitle').textContent='消息';
    document.getElementById('topSub').textContent='DISPATCH · 来自船务长与船队的信号';
    c.innerHTML=renderMsg();
  }else if(currentView.tab==='captain'){
    document.getElementById('topTitle').textContent='船长';
    document.getElementById('topSub').textContent='CAPTAIN · 你的航海身份';
    c.innerHTML=renderCaptain();
  }
}
function getIsland(id){return ISLANDS.find(i=>i.id===id)}

/* ============ 岛屿页 ============ */
function renderIslands(){
  const d=loadData();
  const total=ISLANDS.reduce((s,i)=>s+totalDays(i.id),0);
  const maxStreak=Math.max(0,...ISLANDS.map(i=>streak(i.id)));
  let html=`
    <div class="voyage-hero">
      <div class="ship">⛵</div>
      <div class="eyebrow">CHAPTER · ${new Date().getFullYear()}</div>
      <div class="title">今日出海</div>
      <div class="desc">已征服 ${total} 次 · 最长连续 ${maxStreak} 天</div>
      <svg class="waves" viewBox="0 0 400 44" preserveAspectRatio="none">
        <path d="M0 20 Q 50 0 100 20 T 200 20 T 300 20 T 400 20 V44 H0 Z" fill="#7DC4FF" opacity=".25"/>
        <path d="M0 28 Q 50 12 100 28 T 200 28 T 300 28 T 400 28 V44 H0 Z" fill="#7DC4FF" opacity=".4"/>
      </svg>
    </div>
    <div class="section-title">你的岛屿 · Your Islands</div>
  `;
  ISLANDS.forEach(is=>{
    const s=streak(is.id),done=isCheckedToday(is.id);
    const meta=done
      ?`<span class="dot"></span>今日已打卡 · 累计 ${totalDays(is.id)} 天`
      :`<span class="dot off"></span>今日未打卡`;
    html+=`<div class="island-card" onclick="openIsland('${is.id}')">
      <div class="island-icon" style="background:${is.bg}">${is.icon}</div>
      <div class="island-info">
        <div class="island-name">${is.name} <span style="font-family:'Cinzel',serif;font-size:10px;color:${is.color};margin-left:4px;letter-spacing:2px">${is.en}</span></div>
        <div class="island-slogan">"${is.slogan}"</div>
        <div class="island-meta">${meta}</div>
      </div>
      <div class="island-streak">${s}<small>D</small></div>
    </div>`;
  });
  html+=`<div class="create-card" onclick="toast('开辟新航线','自定义岛屿功能正在筹备，敬请期待')">＋ 开辟新航线（申请岛主）</div>`;
  return html;
}

function renderIsland(id){
  const is=getIsland(id),s=streak(id),done=isCheckedToday(id);
  const checkins=getCheckins(id);
  let grid='';const today=new Date();
  for(let i=20;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=dateStr(d),has=checkins.includes(ds);
    const isToday=ds===todayStr();
    grid+=`<div class="grid-cell ${has?'done':''} ${isToday?'today':''}">${d.getDate()}</div>`;
  }
  const btn=done
    ?`<button class="btn-primary" disabled>✓ 今日已打卡 · ${is.action}</button>`
    :`<button class="btn-primary" onclick="checkin('${id}')">扬帆登岛 · ${is.action}</button>`;
  const adBtn=(done||!AD_MAKEUP_ENABLED)?'':`<button class="btn-ghost-gold" onclick="watchAd('${id}')">📺 看广告补签今日</button>`;
  const certNote=s>=TARGET?'<div class="cert-card"><div class="ct">🏴‍☠️ 已征服本岛</div><div class="cd">连续 21 天登岛达成，可联系船务长登官方船</div></div>':'';
  return `
    <div class="detail-hero">
      <div class="ic">${is.icon}</div>
      <h2>${is.name}</h2>
      <div class="slogan">"${is.slogan}"</div>
      <div class="streak-big">${s}</div>
      <div class="streak-label">CONSECUTIVE · TARGET ${TARGET}</div>
    </div>
    ${certNote}
    <div class="section-title">最近 21 天 · Last 21 Days</div>
    <div class="progress-grid">${grid}</div>
    ${btn}${adBtn}
    <div class="section-title">岛屿规则 · Rules</div>
    <div class="list-item"><span class="li-ic">📌</span><span class="li-text">每日打卡"${is.action}"，连续 ${TARGET} 天征服本岛</span></div>
    <div class="list-item" onclick="openService()"><span class="li-ic">👥</span><span class="li-text">加入官方船队 · 找搭子</span><span class="li-arrow">›</span></div>
    <div class="list-item" onclick="switchTab('port')"><span class="li-ic">⚓</span><span class="li-text">去港口分享今日日志</span><span class="li-arrow">›</span></div>
  `;
}

/* ============ 港口 ============ */
let portFilter='all';
function renderPort(){
  const d=loadData();
  const filters=[{id:'all',name:'全部'},...ISLANDS.map(i=>({id:i.id,name:i.name}))];
  let html=`<div class="port-tags">`;
  filters.forEach(f=>{
    html+=`<div class="chip ${portFilter===f.id?'active':''}" onclick="setPortFilter('${f.id}')">${f.name}</div>`;
  });
  html+=`</div>`;

  const posts=d.posts.filter(p=>portFilter==='all'||p.island===portFilter);
  if(!posts.length){
    html+=`<div class="empty"><span class="big">🌊</span>这片海域还很安静<br>点右下角 ＋ 发出第一条日志</div>`;
    return html;
  }
  html+=`<div class="masonry">`;
  posts.forEach((p,i)=>{
    const ar=(i%3===0)?'3/4':(i%3===1)?'1/1':'4/5';
    let cover='';
    if(p.image){
      cover=`<img class="cover" src="${p.image}" style="--ar:${ar}" alt="">`;
    }else{
      cover=`<div class="cover gradient" style="--ar:${ar};background:${p.bg||'linear-gradient(135deg,#123A6B,#0A1F3D)'}"><span class="emoji">${p.emoji||'⚓'}</span></div>`;
    }
    html+=`<div class="post" onclick="toast('${p.author}','${p.text.replace(/'/g,"\\'")}')">
      ${cover}
      <div class="body">
        <div class="title">${p.text}</div>
        <div>${(p.tags||[]).map(t=>`<span class="post-tag">#${t}</span>`).join('')}</div>
        <div class="meta">
          <div class="author"><div class="avatar">${p.avatar}</div>${p.author}</div>
          <div class="likes">♥ ${p.likes}</div>
        </div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}
function setPortFilter(f){portFilter=f;render()}

function openComposer(){
  composerImgs=[null,null,null];composerTags=[];
  document.getElementById('composeText').value='';
  const tags=['清心岛','戒烟岛','健身岛','早睡岛','日更','新船员','妙招'];
  document.getElementById('composeTags').innerHTML=tags.map(t=>
    `<span class="composer-tag" onclick="toggleTag(this,'${t}')">#${t}</span>`).join('');
  refreshComposerImgs();
  openMask('maskCompose');
}
function toggleTag(el,t){
  el.classList.toggle('on');
  if(composerTags.includes(t))composerTags=composerTags.filter(x=>x!==t);
  else composerTags.push(t);
}
function pickImg(i){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{composerImgs[i]=ev.target.result;refreshComposerImgs();};
    r.readAsDataURL(f);
  };
  inp.click();
}
function refreshComposerImgs(){
  const c=document.getElementById('composeImgs');
  c.innerHTML=composerImgs.map((img,i)=>
    img
      ?`<div class="img-slot" onclick="composerImgs[${i}]=null;refreshComposerImgs()"><img src="${img}" alt=""></div>`
      :`<div class="img-slot" onclick="pickImg(${i})">＋</div>`
  ).join('');
}
function submitPost(){
  const text=document.getElementById('composeText').value.trim();
  if(!text){toast('未填写内容','写点什么吧，哪怕一句');return;}
  const d=loadData();
  const img=composerImgs.find(x=>x);
  const emojiPool=['⚓','🌊','🧭','🏴‍☠️','⛵','💪','🌙','🧘','🚭'];
  const bgPool=['linear-gradient(135deg,#123A6B,#4da6ff)','linear-gradient(135deg,#0F6E56,#2ecc9e)','linear-gradient(135deg,#3b2205,#e8b84a)','linear-gradient(135deg,#1a1550,#7a6be0)'];
  const post={
    id:'u'+Date.now(),
    author:(d.captain&&d.captain.name)||'匿名船员',
    avatar:(d.captain&&d.captain.name)?d.captain.name[0]:'匿',
    text,tags:composerTags,likes:0,ago:'刚刚',
    image:img||null,
    emoji:emojiPool[Math.floor(Math.random()*emojiPool.length)],
    bg:bgPool[Math.floor(Math.random()*bgPool.length)],
  };
  d.posts.unshift(post);saveData(d);
  closeMask('maskCompose');
  toast('日志已发布','已寄往港口，等待船员们的回音');
  render();
}

/* ============ 船长 ============ */

      });
    }else{
      certs=`<div class="empty" style="padding:24px 12px"><span class="big">🏴‍☠️</span>还没有征服证书<br>连续 21 天登岛即可获得</div>`;
    }
    return `
      <div class="captain-hero">
        <div class="captain-row">

          <div>
            <div class="captain-name">${d.captain.name}</div>

          </div>
        </div>
        <div class="captain-stats">
          <div class="cstat"><div class="n">${totalCheckins}</div><div class="l">累计打卡</div></div>
          <div class="cstat"><div class="n">${maxStreak}</div><div class="l">最长连续</div></div>
          <div class="cstat"><div class="n">${certCount}</div><div class="l">征服证书</div></div>
        </div>
      </div>
      <div class="section-title">征服证书 · Certificates</div>
      ${certs}
      <div class="section-title">船员服务 · Services</div>
      <div class="list-item" onclick="openService()"><span class="li-ic">💬</span><span class="li-text">联系船务长 · 进官方船队</span><span class="li-arrow">›</span></div>
      <div class="list-item" onclick="toast('打卡提醒','推送提醒即将上线')"><span class="li-ic">🔔</span><span class="li-text">打卡提醒</span><span class="li-arrow">›</span></div>
      <div class="list-item" onclick="toast('隐私政策','请在 App 上线后查看完整隐私政策')"><span class="li-ic">🔒</span><span class="li-text">隐私政策</span><span class="li-arrow">›</span></div>
      <div class="list-item" onclick="logout()"><span class="li-ic">🚪</span><span class="li-text">退出登录</span><span class="li-arrow">›</span></div>

    <div class="captain-hero" style="text-align:center;padding:28px 20px">

      <div class="captain-name" style="font-size:20px">登船 · 领取你的船长证</div>

    <div class="auth-tabs">

function renderAuthForm(){
  if(authMode==='phone'){
    return `
      <div class="field"><label>手机号 · PHONE</label>
        <input class="input" id="ap_phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号"></div>
      <div class="field"><label>验证码 · CODE</label>
        <div class="row-code">
          <input class="input" id="ap_code" type="tel" maxlength="6" placeholder="6 位验证码">
          <button class="btn-code" id="ap_send" onclick="sendCode('phone')">${codeCountdown?codeCountdown+' 秒':'获取验证码'}</button>
        </div>
      </div>
      <button class="btn-primary" onclick="doAuth('phone')">扬帆登船</button>
    `;
  }
  if(authMode==='email'){
    return `
      <div class="field"><label>邮箱 · EMAIL</label>
        <input class="input" id="ae_email" type="email" placeholder="captain@grandblue.io"></div>
      <div class="field"><label>验证码 · CODE</label>
        <div class="row-code">
          <input class="input" id="ae_code" type="text" maxlength="6" placeholder="6 位验证码">
          <button class="btn-code" id="ae_send" onclick="sendCode('email')">${codeCountdown?codeCountdown+' 秒':'发送到邮箱'}</button>
        </div>
      </div>
      <button class="btn-primary" onclick="doAuth('email')">扬帆登船</button>
      <div style="text-align:center;font-size:11px;color:var(--sub);margin-top:12px">首次使用邮箱登录即视为注册</div>
    `;
  }
  return `
    <div class="field"><label>账号 · ACCOUNT</label>
      <input class="input" id="au_name" type="text" placeholder="船长代号 / 手机号 / 邮箱"></div>
    <div class="field"><label>密码 · PASSWORD</label>
      <input class="input" id="au_pass" type="password" placeholder="至少 6 位"></div>
    <button class="btn-primary" onclick="doAuth('password')">扬帆登船</button>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px">
      <a style="color:var(--sub);cursor:pointer" onclick="toast('注册新账号','请先用手机或邮箱验证码登录，系统会自动创建账号')">注册新账号</a>
      <a style="color:var(--gold);cursor:pointer" onclick="toast('找回密码','请通过手机验证码或邮箱验证码登录后重置密码')">忘记密码？</a>
    </div>
  `;
}
function setAuthMode(m){authMode=m;render()}
function sendCode(type){
  const val=document.getElementById(type==='phone'?'ap_phone':'ae_email').value.trim();
  if(type==='phone'&&!/^1\d{10}$/.test(val)){toast('提示','请输入正确的 11 位手机号');return;}
  if(type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){toast('提示','请输入正确的邮箱');return;}
  codeCountdown=60;
  const btn=document.getElementById(type==='phone'?'ap_send':'ae_send');
  btn.disabled=true;btn.textContent=codeCountdown+' 秒';
  const timer=setInterval(()=>{
    codeCountdown--;
    if(codeCountdown<=0){clearInterval(timer);btn.disabled=false;btn.textContent=type==='phone'?'获取验证码':'发送到邮箱';}
    else btn.textContent=codeCountdown+' 秒';
  },1000);
  toast('验证码已发送','演示环境请直接输入 123456 完成登录');
}
function doAuth(type){
  let name='';
  if(type==='phone'){
    const p=document.getElementById('ap_phone').value.trim();
    const c=document.getElementById('ap_code').value.trim();
    if(!/^1\d{10}$/.test(p)){toast('提示','请输入正确的手机号');return;}
    if(c!=='123456'){toast('验证失败','演示环境验证码为 123456');return;}
    name='船长·'+p.slice(-4);
  }else if(type==='email'){
    const e=document.getElementById('ae_email').value.trim();
    const c=document.getElementById('ae_code').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast('提示','请输入正确的邮箱');return;}
    if(c!=='123456'){toast('验证失败','演示环境验证码为 123456');return;}
    name=e.split('@')[0];
  }else{
    const n=document.getElementById('au_name').value.trim();
    const p=document.getElementById('au_pass').value;
    if(!n||p.length<6){toast('提示','账号不能为空，密码至少 6 位');return;}
    name=n;
  }
  const d=loadData();
  d.captain={name,loginBy:type,at:Date.now()};
  saveData(d);
  toast('登船成功','欢迎回来，'+name);
  render();
}
function logout(){
  const d=loadData();d.captain=null;saveData(d);
  toast('已离船','下次登录时航海记录会自动恢复');
  render();
}

/* ============ 交互 ============ */
function switchTab(tab){currentView={tab,island:null};render();document.getElementById('content').scrollTop=0}
function openIsland(id){currentView={tab:currentView.tab,island:id};render();document.getElementById('content').scrollTop=0}
function goBack(){currentView={tab:currentView.tab,island:null};render();document.getElementById('content').scrollTop=0}

function checkin(id){

  if(r==='cert'){
    const is=getIsland(id);
    document.getElementById('certTitle').textContent='征服 '+is.name;
    document.getElementById('certInfo').textContent=is.name+' · 连续 '+TARGET+' 天 · '+todayStr();

  }else if(r){
    render();
    toast('登岛成功','连续 '+streak(id)+' 天 · 距离征服还差 '+(TARGET-streak(id))+' 天');

let adTimer=null;
function watchAd(id){
  if(isCheckedToday(id)){toast('提示','今日已打卡，无需补签');return;}
  document.getElementById('adCount').textContent='5';openMask('maskAd');

  },1000);

function openService(){openMask('maskService')}
function confirmDelete(){openMask('maskDelete')}
function doDelete(){
  localStorage.removeItem('dalanhai_v2');
  closeMask('maskDelete');
  currentView={tab:'islands',island:null};render();
  toast('已弃船','账号与本地记录已清除，7天冷静期后彻底删除');
}
function openMask(id){document.getElementById(id).classList.add('show')}

function toast(title,text){
  document.getElementById('toastTitle').textContent=title;
  document.getElementById('toastText').textContent=text;
  openMask('maskToast');
}

/* 简易二维码占位 */
function drawQR(){
  const svg=document.getElementById('qrSvg');
  let cells='';const size=21,cell=140/size;let seed=7;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const corner=(x<7&&y<7)||(x>=size-7&&y<7)||(x<7&&y>=size-7);
    let on;
    if(corner){
      const cx=x<7?3:size-4,cy=y<7?3:size-4;
      on=(Math.abs(x-cx)<=3&&Math.abs(y-cy)<=3);
      if(Math.abs(x-cx)===2||Math.abs(y-cy)===2)on=false;
      if(Math.abs(x-cx)<=1&&Math.abs(y-cy)<=1)on=true;
    }else on=rnd()>0.5;
    if(on)cells+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#0A1F3D"/>`;
  }
  svg.innerHTML=cells;
}
render();
