workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 40
    integrations:
      app_store_connect: 大蓝海
    environment:
      vars:
        BUNDLE_ID: com.kaitengguan.dalanhai
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kaitengguan.dalanhai
    scripts:
      - name: Install npm dependencies
        script: npm install --omit=dev

      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/
          cp wechat-qr.jpg www/

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync web code to iOS
        script: npx cap sync ios

      - name: Declare no encryption
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist 2>/dev/null || true

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          PP_NAME=$(xcodebuild -workspace ios/App/App.xcworkspace -scheme App -showBuildSettings 2>/dev/null | grep "PROVISIONING_PROFILE_SPECIFIER" | head -1 | awk -F'= ' '{print $2}' | tr -d ' \r')
          if [ -z "$PP_NAME" ]; then PP_NAME="dalanhai"; fi
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>method</key>\n\t<string>app-store</string>\n\t<key>teamID</key>\n\t<string>5QLTMB4JGC</string>\n\t<key>provisioningProfiles</key>\n\t<dict>\n\t\t<key>com.kaitengguan.dalanhai</key>\n\t\t<string>%s</string>\n\t</dict>\n\t<key>uploadSymbols</key>\n\t<true/>\n\t<key>compileBitcode</key>\n\t<false/>\n</dict>\n</plist>' "$PP_NAME" > export_options.plist
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App --export-options-plist export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
