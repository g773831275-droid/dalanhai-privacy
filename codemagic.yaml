workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 35
    environment:
      vars:
        XCODE_VERSION: 15.4
        BUNDLE_ID: com.kaitengguan.dalanhai
        TEAM_ID: 5QLTMB4JGC
      ios_signing:
        certificates:
          - dalanhai
        provisioning_profiles:
          - dalanhai
    scripts:
      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/
          [ -f *.css ] && cp *.css www/ || true
          [ -f *.js ] && cp *.js www/ || true
          [ -f *.png ] && cp *.png www/ || true
          [ -f *.jpg ] && cp *.jpg www/ || true
          [ -f *.svg ] && cp *.svg www/ || true

      - name: Install npm dependencies
        script: npm install

      - name: Add iOS platform
        script: npx cap add ios

      - name: Sync web code to iOS
        script: npx cap sync ios
    # Codemagic 自动编译打包输出IPA
    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
      - ios/App/*.xcarchive
