workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      vars:
        XCODE_VERSION: 15.4
        BUNDLE_ID: "com.kaitengguan.dalanghai"
    scripts:
      # 1. 安全创建并填充www文件夹（适配你没有css/js文件的情况）
      - name: Prepare web directory
        script: |
          mkdir -p www
          cp index.html www/
          if ls *.css 1> /dev/null 2>&1; then cp *.css www/; fi
          if ls *.js 1> /dev/null 2>&1; then cp *.js www/; fi
          if ls *.png 1> /dev/null 2>&1; then cp *.png www/; fi
          if ls *.jpg 1> /dev/null 2>&1; then cp *.jpg www/; fi
          if ls *.svg 1> /dev/null 2>&1; then cp *.svg www/; fi
      # 2. 安装依赖
      - name: Install dependencies
        script: |
          npm install
      # 3. 添加iOS平台
      - name: Add Capacitor iOS platform
        script: |
          npx cap add ios
      # 4. 同步代码到iOS项目
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      # 5. 用Xcode原生命令编译Release版本（关键修改！替代cap build命令）
      - name: Build iOS Release
        script: |
          cd ios/App
          # 先创建导出配置文件
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>YOUR_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          # 编译并打包
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ./build/App.xcarchive
          xcodebuild -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ./build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
