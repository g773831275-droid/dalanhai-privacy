workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      vars:
        XCODE_VERSION: 15.4
        BUNDLE_ID: "com.kaitengguan.dalanghai"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add Capacitor iOS platform
        script: |
          npx cap add ios
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build iOS Release
        script: |
          npx cap build ios --release
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
