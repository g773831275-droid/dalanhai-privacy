workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 40
    environment:
      vars:
        XCODE_VERSION: 15.4
        BUNDLE_ID: com.kaitengguan.dalanhai
        TEAM_ID: 5QLTMB4JGC
      ios_signing:
        certificates:
          - dalanhai
        provisioning_profiles:
          - dalanhai
    scripts:
      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/
          [ -f *.css ] && cp *.css www/ || true
          [ -f *.js ] && cp *.js www/ || true
          [ -f *.png ] && cp *.png www/ || true
          [ -f *.jpg ] && cp *.jpg www/ || true
          [ -f *.svg ] && cp *.svg www/ || true

      - name: Install npm dependencies
        script: npm install

      - name: Add iOS platform
        script: npx cap add ios

      - name: Sync web code to iOS
        script: npx cap sync ios

      - name: Build iOS App (Generate IPA)
        script: |
          cd ios/App
          # 用 Codemagic 内置签名配置编译，避免本地账号错误
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build/DerivedData \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$BUNDLE_ID"

    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
      - ios/App/build/DerivedData/Logs/Build/*.log
