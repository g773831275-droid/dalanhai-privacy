workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 40
    environment:
      vars:
        XCODE_VERSION: 15.4
        BUNDLE_ID: com.kaitengguan.dalanhai
        TEAM_ID: 5QLTMB4JGC
      ios_signing:
        certificates:
          - dalanhai
        provisioning_profiles:
          - dalanhai
    scripts:
      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/
          [ -f *.css ] && cp *.css www/ || true
          [ -f *.js ] && cp *.js www/ || true
          [ -f *.png ] && cp *.png www/ || true
          [ -f *.jpg ] && cp *.jpg www/ || true
          [ -f *.svg ] && cp *.svg www/ || true

      - name: Install npm dependencies
        script: npm install

      - name: Add iOS platform
        script: npx cap add ios

      - name: Sync web code to iOS
        script: npx cap sync ios

      - name: Build and Export IPA (无签名冲突版)
        script: |
          cd ios/App
          mkdir -p build

          # 编译并归档（只让Codemagic自动处理签名，不手动指定参数）
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/App.xcarchive \
            -allowProvisioningUpdates

          # 导出IPA文件（自动匹配你的Team ID和签名）
          xcodebuild -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist <(cat << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>app-store</string>
  <key>teamID</key>
  <string>5QLTMB4JGC</string>
  <key>signingStyle</key>
  <string>automatic</string>
</dict>
</plist>
EOF
) \
            -exportPath ./build/ipa

          # 把IPA复制到Codemagic的标准产物目录，确保能被识别
          mkdir -p $CM_BUILD_DIR/artifacts
          cp ./build/ipa/*.ipa $CM_BUILD_DIR/artifacts/

    artifacts:
      - $CM_BUILD_DIR/artifacts/*.ipa
