workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 40
    environment:
      vars:
        BUNDLE_ID: com.kaitengguan.dalanhai
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kaitengguan.dalanhai
    scripts:
      - name: Install npm dependencies
        script: npm install --omit=dev

      - name: Prepare web assets
        script: |
          mkdir -p www
          cp index.html www/
          cp wechat-qr.jpg www/

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync web code to iOS
        script: npx cap sync ios

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --configuration Release

    artifacts:
      - build/ios/ipa/*.ipa
